name: DAST

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: Public URL of the already-running Compose app
        required: true
        type: string

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Smoke the running app
        env:
          APP_URL: ${{ inputs.app_url }}
        run: |
          base="${APP_URL%/}"
          case "$base" in
            https://*|http://*) ;;
            *)
              echo "app_url must be an http or https URL of the Compose app."
              exit 1
              ;;
          esac
          curl -sf "$base/status" -o /tmp/status.json
          python3 -c 'import json; assert isinstance(json.load(open("/tmp/status.json")), dict)'
          echo "APP_BASE=$base" >> "$GITHUB_ENV"

      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ env.APP_BASE }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline

      # ZAP is the required scan. StackHawk needs an application UUID from
      # app.stackhawk.com. An API key in HAWK_APP_ID is not that id and must
      # not fail DAST after ZAP has passed.
      - name: Decide whether to run StackHawk
        id: hawk
        env:
          HAWK_APP_ID: ${{ secrets.HAWK_APP_ID }}
        run: |
          if printf '%s' "$HAWK_APP_ID" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "StackHawk skipped: HAWK_APP_ID must be the application UUID from app.stackhawk.com. OWASP ZAP is the required DAST scan."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: StackHawk
        if: steps.hawk.outputs.enabled == 'true'
        uses: stackhawk/hawkscan-action@v3.1.1
        env:
          HAWK_APP_ID: ${{ secrets.HAWK_APP_ID }}
          APP_URL: ${{ env.APP_BASE }}
        with:
          apiKey: ${{ secrets.HAWK_API_KEY }}
