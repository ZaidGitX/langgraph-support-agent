name: DAST

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: Public URL of the already-running Compose app
        required: true
        type: string

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Smoke the running app
        env:
          APP_URL: ${{ inputs.app_url }}
        run: |
          base="${APP_URL%/}"
          case "$base" in
            https://*|http://*) ;;
            *)
              echo "app_url must be an http or https URL of the Compose app."
              exit 1
              ;;
          esac
          curl -sf "$base/status" -o /tmp/status.json
          python3 -c 'import json; assert isinstance(json.load(open("/tmp/status.json")), dict)'
          echo "APP_BASE=$base" >> "$GITHUB_ENV"

      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ env.APP_BASE }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline

      - name: Require StackHawk application id
        env:
          HAWK_API_KEY: ${{ secrets.HAWK_API_KEY }}
          HAWK_APP_ID: ${{ secrets.HAWK_APP_ID }}
        run: |
          if [ -z "$HAWK_API_KEY" ]; then
            echo "StackHawk needs GitHub secret HAWK_API_KEY."
            exit 1
          fi
          if [ -z "$HAWK_APP_ID" ]; then
            echo "StackHawk needs the application UUID from app.stackhawk.com."
            echo "Set GitHub secret HAWK_APP_ID to that id. Do not invent one."
            exit 1
          fi

      - name: StackHawk
        uses: stackhawk/hawkscan-action@v3.1.1
        env:
          HAWK_APP_ID: ${{ secrets.HAWK_APP_ID }}
          APP_URL: ${{ env.APP_BASE }}
        with:
          apiKey: ${{ secrets.HAWK_API_KEY }}
