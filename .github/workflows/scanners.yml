name: Scanners

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install semgrep

      - name: SAST (Semgrep)
        run: semgrep scan --config p/python --metrics=off app mcp_server orchestrator

      - name: SCA (pip-audit)
        run: |
          set +e
          pip-audit -r requirements.txt --format json -o audit.json
          set -e
          python scripts/audit_gate.py audit.json

      - name: Vulnerabilities (Trivy filesystem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL

      - name: Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
