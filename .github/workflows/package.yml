name: Package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build artifact
        run: python -m orchestrator.local_ops package

      - uses: actions/upload-artifact@v4
        with:
          name: support-app
          path: dist/langgraph-support-app.tgz
