name: Orchestrator

on:
  push:

permissions:
  contents: read
  actions: write

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Read the run profile
        # orchestrator.yaml decides where this push goes: ORCHESTRATOR_DISPATCH, cloud apply,
        # and the config names a platform needs (AWS_REGION, ...). Secrets stay repository
        # secrets. The container's user writes var/ (generated files, retrieval cache, source zip)
        # and, when a stage runs on the host, __pycache__ and build output in the checkout.
        run: |
          python3 scripts/profile_env.py | tee -a "$GITHUB_ENV"
          mkdir -p var && chmod -R a+rwX .

      - name: Start the Compose application
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          # Cloud, scanner, and signing placeholders (names from orchestrator/credentials.json).
          # A secret that is not set resolves to empty, so that provider runs in plan mode.
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_DEVOPS_EXT_PAT: ${{ secrets.AZURE_DEVOPS_EXT_PAT }}
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GCLOUD_SA_KEY: ${{ secrets.GCLOUD_SA_KEY }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          HAWK_API_KEY: ${{ secrets.HAWK_API_KEY }}
          HAWK_APP_ID: ${{ secrets.HAWK_APP_ID }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          TRIVY_TOKEN: ${{ secrets.TRIVY_TOKEN }}
          OPENAI_MODEL: gpt-6-astra
          TYPESAFE_MODEL: jev-latest
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          # ORCHESTRATOR_DISPATCH and ORCHESTRATOR_CLOUD_APPLY come from the profile step above.
          ORCHESTRATOR_AUTOSTART: "1"
          # The tunnel URL is public. Set this repository secret (the Connections panel's
          # "Sync secrets to GitHub" copies the vault's value) and the dashboard asks for the
          # same value once per tab before it accepts any change. Unset = open, as before.
          ORCHESTRATOR_UI_TOKEN: ${{ secrets.ORCHESTRATOR_UI_TOKEN }}
        # docker-compose.ci.yml mounts the pushed checkout: the run works on the pushed tree.
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait

      - name: Install cloudflared
        run: |
          curl -fsSL -o /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Open the tunnel and wait for the UI session
        env:
          # A platform run (provisioning, one CodeBuild build per stage in waves, deploy, UAT)
          # needs more than the hour a host-only run took.
          SESSION_TIMEOUT_SECONDS: "5400"
          APP_LOCAL_URL: http://127.0.0.1:8000
          ORCHESTRATOR_UI_TOKEN: ${{ secrets.ORCHESTRATOR_UI_TOKEN }}
        run: |
          set -euo pipefail
          nohup cloudflared tunnel --url http://127.0.0.1:8000 --no-autoupdate > /tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cloudflared.pid
          url=""
          for _ in $(seq 1 40); do
            url=$(grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 || true)
            if [ -n "$url" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$url" ]; then
            echo "cloudflared did not print a public URL."
            cat /tmp/cloudflared.log
            exit 1
          fi
          echo "PUBLIC APP URL: $url"
          echo "Open this URL and answer the ecosystem questions: ${url}/#/orchestrator"
          if [ -n "${ORCHESTRATOR_UI_TOKEN:-}" ]; then echo "The dashboard will ask for the ORCHESTRATOR_UI_TOKEN repository secret."; else echo "No ORCHESTRATOR_UI_TOKEN secret is set: the dashboard accepts changes from anyone with this URL."; fi
          PUBLIC_APP_URL="$url" python3 - <<'PY'
          import json
          import os
          import urllib.request

          url = os.environ["PUBLIC_APP_URL"]
          body = json.dumps({"url": url}).encode()
          headers = {"content-type": "application/json"}
          if os.environ.get("ORCHESTRATOR_UI_TOKEN"):
              headers["X-Orchestrator-Token"] = os.environ["ORCHESTRATOR_UI_TOKEN"]
          request = urllib.request.Request(
              "http://127.0.0.1:8000/api/orchestrator/public-url",
              data=body,
              headers=headers,
          )
          urllib.request.urlopen(request, timeout=30).read()
          PY
          python3 scripts/wait_for_session.py

      - name: Stop the application
        if: always()
        run: |
          # The container's own log (already redacted by the orchestrator) is the only trace of
          # an exception once the runner is gone: keep its tail in the job log.
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color --tail 400 orchestrator || true
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down
